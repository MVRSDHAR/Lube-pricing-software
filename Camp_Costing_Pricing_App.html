<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Camp — Costing &amp; Pricing</title>
<style>
:root{
  --navy:#1f3864; --ink:#1b2432; --muted:#6b7686; --line:#e2e7ef; --bg:#f5f7fa;
  --accent:#1f3864; --good:#1e6b3a; --bad:#9c2b2b; --amber:#8a6100;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:14px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg)}
button{font:inherit;cursor:pointer}
a{color:var(--accent);text-decoration:none}
code{background:#eef1f6;padding:1px 5px;border-radius:3px;font-size:12px}

/* layout */
.shell{display:flex;min-height:100vh}
.side{width:216px;flex:0 0 216px;background:var(--navy);color:#fff;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{padding:18px 18px 14px;border-bottom:1px solid rgba(255,255,255,.14)}
.brand b{display:block;font-size:17px;letter-spacing:.3px}
.brand span{display:block;font-size:11.5px;opacity:.75;letter-spacing:.4px;text-transform:uppercase;margin-top:2px}
.brand.big{padding:0 0 18px;border:0;color:var(--navy)}
.brand.big b{font-size:22px}
.brand.big span{opacity:.6;color:var(--navy)}
.side nav{display:flex;flex-direction:column;padding:10px 0;overflow:auto}
.side nav a{color:rgba(255,255,255,.82);padding:9px 18px;font-size:13.5px;border-left:3px solid transparent}
.side nav a:hover{background:rgba(255,255,255,.07);color:#fff}
.side nav a.on{background:rgba(255,255,255,.12);color:#fff;border-left-color:#fff;font-weight:600}
.sidefoot{margin-top:auto;padding:14px 18px;border-top:1px solid rgba(255,255,255,.14);font-size:12px}
.sidefoot .who{opacity:.75;margin-bottom:6px}
.sidefoot .link{color:#fff;background:none;border:0;padding:0;text-decoration:underline;font-size:12px}
main{flex:1;min-width:0;padding:0 26px 60px}
.top{display:flex;align-items:center;gap:16px;padding:18px 0 14px;border-bottom:1px solid var(--line);margin-bottom:18px}
.top h1{font-size:19px;margin:0;font-weight:650;letter-spacing:.2px}
.top .actions{margin-left:auto;display:flex;gap:8px}

/* bits */
.bar{display:flex;align-items:center;gap:8px;margin:0 0 14px;flex-wrap:wrap}
.grow{flex:1}
.btn{background:var(--accent);color:#fff;border:1px solid var(--accent);padding:7px 13px;border-radius:5px;font-size:13px;font-weight:600}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:#fff;color:var(--accent);border-color:#c8d1e0}
.btn.ghost:hover{background:#f0f3f8}
.link{background:none;border:0;color:var(--accent);text-decoration:underline;padding:0;font-size:12.5px}
.chip{background:#fff;border:1px solid #c8d1e0;color:var(--ink);padding:6px 12px;border-radius:16px;font-size:13px}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff;font-weight:600}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.card{background:#fff;border:1px solid var(--line);border-radius:7px;overflow:hidden;margin-bottom:16px}
.card.pad{padding:16px 18px}
.card h3{margin:0 0 10px;font-size:14px;font-weight:650}
.card h4{margin:20px 0 8px;font-size:12.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-weight:700}
.pad{padding:14px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:900px){.cols{grid-template-columns:1fr}.side{display:none}}

/* tables */
table.grid{width:100%;border-collapse:collapse;font-size:12.8px}
table.grid th{background:#f2f5f9;text-align:left;padding:9px 10px;font-weight:650;color:#44506a;border-bottom:1px solid var(--line);position:sticky;top:0;white-space:nowrap}
table.grid td{padding:8px 10px;border-bottom:1px solid #eef1f6;vertical-align:top}
table.grid tbody tr:hover{background:#fafbfd}
table.grid tbody tr.newprod td{border-top:2px solid #cfd8e6}
table.grid.compact th,table.grid.compact td{padding:7px 8px;font-size:12.2px}
input.qty{width:74px}
table.grid tr.total td{font-weight:700;background:#f7f9fc;border-top:2px solid #dfe5ee}
table.grid tr.diff td{background:#fffdf3}
.r{text-align:right;font-variant-numeric:tabular-nums}
.c{text-align:center}
.up{color:var(--good)} .down{color:var(--bad)}

/* stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:16px}
.stats.tight{grid-template-columns:repeat(3,1fr);margin-bottom:0}
.stats.four{grid-template-columns:repeat(4,1fr);margin-bottom:0}
.stat{background:#fff;border:1px solid var(--line);border-radius:7px;padding:13px 15px}
.stat b{display:block;font-size:20px;font-weight:650;letter-spacing:-.3px}
.stat span{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.stat.warn b{color:var(--bad)}

/* formulations */
.split{display:grid;grid-template-columns:300px 1fr;gap:16px;align-items:start}
@media(max-width:1000px){.split{grid-template-columns:1fr}}
.gradelistwrap{display:flex;flex-direction:column;gap:4px;max-height:78vh;overflow:auto;padding-right:4px}
.gradelist{text-align:left;background:#fff;border:1px solid var(--line);border-radius:6px;padding:9px 11px;display:flex;flex-direction:column;gap:1px}
.gradelist b{font-size:12.8px}
.gradelist span{font-size:11.5px;color:var(--muted)}
.gradelist i{font-size:10.5px;color:#9aa4b3;font-style:normal}
.gradelist.on{border-color:var(--navy);box-shadow:inset 3px 0 0 var(--navy);background:#f7f9fd}
.blockhead{display:flex;flex-direction:column;gap:2px;padding-bottom:10px;margin-bottom:10px;border-bottom:1px solid var(--line)}
.chain{display:flex;flex-direction:column;gap:0;margin:10px 0 4px;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.chain>div{display:flex;justify-content:space-between;padding:7px 12px;border-bottom:1px solid #eef1f6;font-size:12.8px}
.chain>div:last-child{border-bottom:0}
.chain span{color:#44506a}
.chain b{font-variant-numeric:tabular-nums}
.chain .hl{background:#f2f5f9;font-weight:650}
.chain .rule{font-style:normal;color:#9aa4b3;font-size:11px;margin-left:6px}

/* trace */
.cmpsels select{padding:8px 10px;border:1px solid #c8d1e0;border-radius:5px;font:inherit;font-size:13px;background:#fff;min-width:200px;flex:1}
.search{flex:1;max-width:520px;padding:8px 12px;border:1px solid #c8d1e0;border-radius:5px;font:inherit}
.hits{display:flex;flex-direction:column;gap:4px;max-height:78vh;overflow:auto}
.hit{text-align:left;background:#fff;border:1px solid var(--line);border-radius:6px;padding:8px 10px;display:flex;flex-direction:column}
.hit b{font-size:12.5px;font-weight:600}
.hit span{font-size:11px;color:var(--muted)}

/* inputs */
input.cell{width:92px;text-align:right;padding:4px 6px;border:1px solid #c8d1e0;border-radius:4px;font:inherit;font-size:12.5px;background:#fffdf5}
input.cell:focus{outline:2px solid #c8d1e0;background:#fff}
.tag{display:inline-block;background:#e8f2ea;color:var(--good);font-size:10.5px;padding:1px 6px;border-radius:9px;text-transform:uppercase;letter-spacing:.4px}
.tag.grey{background:#eef1f6;color:#6b7686}
.ok{color:var(--good);font-size:12.8px;margin:6px 0}
.ok::before{content:"✓ ";font-weight:700}
.warnline{color:var(--amber);font-size:12.8px;margin:6px 0}
.auditline{font-size:12px;color:#44506a;padding:5px 0;border-bottom:1px solid #eef1f6}
.verlines{background:#f7f9fc;padding:10px 14px!important}
.auditline span{color:#9aa4b3;margin-right:6px}
.auditline i{color:var(--muted)}
ul.changes{margin:6px 0 0;padding-left:18px;font-size:12.8px}
ul.changes li{margin-bottom:5px}
.stale{background:#fff1f0;border:1px solid #f0b7b2;border-left:4px solid #9c2b2b;border-radius:5px;padding:12px 14px;margin-bottom:16px;font-size:13px}
.stale b{color:#9c2b2b;display:block;margin-bottom:6px}
.stale p{margin:0 0 8px}
.btn.danger{background:#9c2b2b;border-color:#9c2b2b}
.stamp{display:inline-block;background:#fff4d6;color:#7a5300;border:1px solid #f0dca8;padding:5px 11px;border-radius:4px;font-size:11.5px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;margin-bottom:14px}
.preview{background:#f7f9fc;border:1px solid var(--line);border-radius:5px;padding:10px 12px;margin-top:14px;font-size:12.5px}

/* login */
.loginwrap{min-height:100vh;display:grid;place-items:center;background:linear-gradient(160deg,#1f3864,#2b4a7d)}
.login{background:#fff;border-radius:10px;padding:30px 30px 24px;width:min(460px,92vw);box-shadow:0 20px 50px rgba(0,0,0,.3)}
.rolebtn{display:flex;flex-direction:column;gap:2px;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:7px;padding:12px 14px;margin-bottom:9px}
.rolebtn:hover{border-color:var(--navy);background:#f7f9fd}
.rolebtn b{font-size:14px;color:var(--navy)}
.rolebtn span{font-size:12px;color:var(--muted)}
.note{font-size:11.5px;color:#8a94a3;margin-top:14px;line-height:1.5;border-top:1px solid var(--line);padding-top:12px}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(16,24,40,.55);display:grid;place-items:center;z-index:50;padding:20px}
.modal{background:#fff;border-radius:9px;padding:22px 24px;width:min(520px,94vw);max-height:90vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.modal h2{margin:0 0 4px;font-size:17px}
.modal.narrow{width:min(400px,92vw)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
.pwerr{color:#9c2b2b;font-size:12.5px;margin-top:8px;min-height:16px}
.modal label{display:block;font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin:14px 0 4px;font-weight:700}
.modal input,.modal select{width:100%;padding:8px 10px;border:1px solid #c8d1e0;border-radius:5px;font:inherit;font-size:13.5px;background:#fff}
.modalbar{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}

/* print */
@media print{
  .side,.top .actions,.bar,.modal,.overlay,.stale{background:#fff1f0;border:1px solid #f0b7b2;border-left:4px solid #9c2b2b;border-radius:5px;padding:12px 14px;margin-bottom:16px;font-size:13px}
.stale b{color:#9c2b2b;display:block;margin-bottom:6px}
.stale p{margin:0 0 8px}
.btn.danger{background:#9c2b2b;border-color:#9c2b2b}
.stamp{display:none!important}
  body{background:#fff}
  main{padding:0}
  .shell{display:block}
  .split{display:block}
  .gradelistwrap{display:none}
  .card{border:1px solid #ccc;break-inside:avoid}
  table.grid th{background:#eee!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .top{border-bottom:1px solid #999}
  .chain .hl{background:#eee!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>

// Minimal XLSX writer (stored/deflate-free zip). Shared by node tests and the browser app.
function crc32(buf) {
  let c, crc = 0xFFFFFFFF;
  for (let i = 0; i < buf.length; i++) {
    c = (crc ^ buf[i]) & 0xFF;
    for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1;
    crc = (crc >>> 8) ^ c;
  }
  return (crc ^ 0xFFFFFFFF) >>> 0;
}
function u16(n){return [n&255,(n>>8)&255];}
function u32(n){return [n&255,(n>>8)&255,(n>>16)&255,(n>>24)&255];}
function strBytes(s){return new TextEncoder().encode(s);}

function zipStore(files){ // files: [{name, data:Uint8Array}]
  const chunks=[]; const central=[]; let offset=0;
  for(const f of files){
    const nameB=strBytes(f.name); const crc=crc32(f.data); const size=f.data.length;
    const local=[...u32(0x04034b50),...u16(20),...u16(0),...u16(0),...u16(0),...u16(0),
      ...u32(crc),...u32(size),...u32(size),...u16(nameB.length),...u16(0)];
    const head=new Uint8Array(local);
    chunks.push(head,nameB,f.data);
    central.push({nameB,crc,size,offset});
    offset += head.length+nameB.length+size;
  }
  const cdStart=offset; const cdChunks=[];
  for(const c of central){
    const rec=[...u32(0x02014b50),...u16(20),...u16(20),...u16(0),...u16(0),...u16(0),...u16(0),
      ...u32(c.crc),...u32(c.size),...u32(c.size),...u16(c.nameB.length),...u16(0),...u16(0),
      ...u16(0),...u16(0),...u32(0),...u32(c.offset)];
    const b=new Uint8Array(rec); cdChunks.push(b,c.nameB);
    offset += b.length+c.nameB.length;
  }
  const cdSize=offset-cdStart;
  const end=[...u32(0x06054b50),...u16(0),...u16(0),...u16(central.length),...u16(central.length),
    ...u32(cdSize),...u32(cdStart),...u16(0)];
  const all=[...chunks,...cdChunks,new Uint8Array(end)];
  const total=all.reduce((a,b)=>a+b.length,0);
  const out=new Uint8Array(total); let p=0;
  for(const a of all){out.set(a,p);p+=a.length;}
  return out;
}

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function colName(i){let s='';i++;while(i>0){const m=(i-1)%26;s=String.fromCharCode(65+m)+s;i=Math.floor((i-1)/26);}return s;}

function sheetXml(rows, hidden){
  const hid = hidden || [];
  let cols='<cols><col min="1" max="1" width="34" customWidth="1"/><col min="2" max="2" width="14" customWidth="1"/>'+
    '<col min="3" max="3" width="13" customWidth="1"/><col min="4" max="4" width="16" customWidth="1"/>'+
    '<col min="5" max="5" width="10" customWidth="1"/><col min="6" max="9" width="15" customWidth="1"/>';
  hid.forEach(c=>{ cols+='<col min="'+c+'" max="'+c+'" hidden="1" width="9" customWidth="1"/>'; });
  cols+='</cols>';
  let x='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
    '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">'+
    cols+'<sheetData>';
  rows.forEach((row,ri)=>{
    x+='<row r="'+(ri+1)+'">';
    row.forEach((v,ci)=>{
      const ref=colName(ci)+(ri+1);
      if(v===null||v===undefined||v==='') return;
      if(v&&typeof v==='object'&&v.f){
        x+='<c r="'+ref+'"><f>'+esc(String(v.f).replace(/^=/,''))+'</f></c>';
      } else if(typeof v==='number'&&isFinite(v)){
        x+='<c r="'+ref+'"><v>'+v+'</v></c>';
      } else {
        x+='<c r="'+ref+'" t="inlineStr"><is><t xml:space="preserve">'+esc(v)+'</t></is></c>';
      }
    });
    x+='</row>';
  });

}

function buildXlsx(sheets){

  const ct='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
    '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">'+
    '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>'+
    '<Default Extension="xml" ContentType="application/xml"/>'+
    '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>'+
    sheets.map((s,i)=>'<Override PartName="/xl/worksheets/sheet'+(i+1)+'.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>').join('')+
    '</Types>';
  const rels='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
    '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+
    '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>';
  const wb='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
    '<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>'+
    sheets.map((s,i)=>'<sheet name="'+esc(s.name).slice(0,31)+'" sheetId="'+(i+1)+'" r:id="rId'+(i+1)+'"/>').join('')+
    '</sheets></workbook>';
  const wbRels='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
    '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+
    sheets.map((s,i)=>'<Relationship Id="rId'+(i+1)+'" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet'+(i+1)+'.xml"/>').join('')+
    '</Relationships>';
  files.push({name:'[Content_Types].xml',data:strBytes(ct)});
  files.push({name:'_rels/.rels',data:strBytes(rels)});
  files.push({name:'xl/workbook.xml',data:strBytes(wb)});
  files.push({name:'xl/_rels/workbook.xml.rels',data:strBytes(wbRels)});
  sheets.forEach((s,i)=>files.push({name:'xl/worksheets/sheet'+(i+1)+'.xml',data:strBytes(sheetXml(s.rows, s.hiddenCols))}));
  return zipStore(files);
}



window.buildXlsx = buildXlsx;

<script>(function(){
// ---- Calculation engine: the twelve equations, in one place ----
function mkEngine(DB){
  const M = Object.fromEntries(DB.materials.map(m=>[m.id,m]));
  const G = Object.fromEntries(DB.grades.map(g=>[g.id,g]));
  const P = Object.fromEntries(DB.packs.map(p=>[p.id,p]));

  function matOf(m, ctx){
    const o = (ctx.matOverride && ctx.matOverride[m.id]) || {};
    return {
      price: o.price != null ? o.price : ((ctx.matPrice && ctx.matPrice[m.id] != null) ? ctx.matPrice[m.id] : m.price),
      density: o.density != null ? o.density : m.density,
      transport: o.transport != null ? o.transport : m.transport,
      basis: m.basis
    };
  }
  function landed(m, ctx){
    const x = matOf(m, ctx);
    const perKg = x.basis === 'KG' ? x.price : x.price / (x.density || 1);
    return perKg + (x.transport || 0);
  }
  function formulation(gid, ctx){
    const g=G[gid];
    let rows=g.form.map(([mid,pct])=>({mid,pct}));
    if(ctx.formOverride && ctx.formOverride[gid]){
      for(const ch of ctx.formOverride[gid]){
        const r=rows.find(x=>x.mid===ch.mid);
        if(r) r.pct=ch.pct; else rows.push({mid:ch.mid,pct:ch.pct});
      }
    }
    return rows;
  }
  function gradeSettings(gid, ctx){
    const g=G[gid];
    const o=(ctx.gradeOverride&&ctx.gradeOverride[gid])||{};
    return {
      density: o.density!=null?o.density:g.density,
      loss:    o.loss!=null?o.loss:g.loss,
      conv:    o.conv!=null?o.conv:g.conv
    };
  }
  function blend(gid, ctx){
    const rows=formulation(gid,ctx);
    let total=0, kg=0; const lines=[];
    for(const r of rows){
      const m=M[r.mid]; const x=matOf(m,ctx); const L=landed(m,ctx);
      const contribution=r.pct*L;
      total+=r.pct; kg+=contribution;
      lines.push({mat:m,price:x.price,density:x.density,transport:x.transport,basis:x.basis,
                  pct:r.pct,landed:L,contribution,share:0});
    }
    lines.forEach(l=>l.share = kg? l.contribution/kg : 0);
    const s=gradeSettings(gid,ctx);
    const rmL = kg*s.density;
    const afterLoss = rmL*(1+s.loss);
    return {lines,total,kg,rmL,afterLoss,conv:s.conv,bulk:afterLoss+s.conv,density:s.density,loss:s.loss};
  }
  function packCost(pid, ctx){
    const p=P[pid]; const o=(ctx.packOverride&&ctx.packOverride[pid])||{};
    const cp=o.cp!=null?o.cp:p.cp, capp=o.capp!=null?o.capp:p.capp,
          lp=o.lp!=null?o.lp:p.lp, ctp=o.ctp!=null?o.ctp:p.ctp;
    const total = p.cq*cp + p.capq*capp + p.lq*lp + p.ctq*ctp;
    return {total, perLitre: total/p.lpc, litres:p.litres, lpc:p.lpc};
  }
  // margin resolution: most specific rule wins
  const RANK={SKU:6,PRODUCT_PACK:5,PRODUCT:4,PACK:3,BRAND:2,GLOBAL:1};
  function margin(type, sku, ctx){
    const rules=(ctx.marginRules||[]).filter(r=>r.type===type);
    let best=null;
    for(const r of rules){
      let ok=false;
      if(r.scope==='GLOBAL') ok=true;
      else if(r.scope==='BRAND') ok=(r.brand===sku.brand);
      else if(r.scope==='PRODUCT') ok=(r.grade===sku.grade);
      else if(r.scope==='PACK') ok=(r.pack===sku.pack);
      else if(r.scope==='PRODUCT_PACK') ok=(r.grade===sku.grade && r.pack===sku.pack);
      else if(r.scope==='SKU') ok=(r.sku===sku.id);
      if(!ok) continue;
      const score=RANK[r.scope]*1e6 + (r.seq||0);
      if(!best || score>best.score) best={rule:r,score,value:r.value};
    }
    return best ? {value:best.value, rule:best.rule} : {value:0, rule:null};
  }
  function sku(skuId, ctx){
    const s=DB.skus.find(x=>x.id===skuId);
    const b=blend(s.grade,ctx);
    const pk=packCost(s.pack,ctx);
    const cost=b.bulk+pk.perLitre;
    const up=margin('UPLABS',s,ctx);
    const cp=margin('CAMP',s,ctx);
    const upBasic=cost+up.value;
    const upInv=upBasic*(1+s.gst);
    const campBasic=upBasic+cp.value;
    const campInv=campBasic*(1+s.gst);
    const packPrice=campInv*pk.litres;
    return {sku:s,blend:b,pack:pk,cost,upMargin:up.value,upRule:up.rule,cpMargin:cp.value,cpRule:cp.rule,

<script>/* Minimal .xlsx reader — no dependencies. Handles stored and deflated entries,
   shared strings, inline strings and numbers. Uses the browser's DecompressionStream. */
(function () {
  async function inflateRaw(bytes) {
    if (typeof DecompressionStream === 'undefined') throw new Error('This browser cannot read Excel files. Use Chrome or Edge.');
    const source = new ReadableStream({ start(c) { c.enqueue(bytes); c.close(); } });
    const reader = source.pipeThrough(new DecompressionStream('deflate-raw')).getReader();
    const chunks = []; let total = 0;
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      chunks.push(value); total += value.length;
    }
    const out = new Uint8Array(total); let p = 0;
    for (const c of chunks) { out.set(c, p); p += c.length; }
    return out;
  }

  function readEntries(buf) {
    const dv = new DataView(buf), u8 = new Uint8Array(buf);
    let eocd = -1;
    const floor = Math.max(0, u8.length - 66000);
    for (let i = u8.length - 22; i >= floor; i--) {
      if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
    }
    if (eocd < 0) throw new Error('This is not a valid .xlsx file.');
    const count = dv.getUint16(eocd + 10, true);
    const cdOff = dv.getUint32(eocd + 16, true);
    const out = {};
    let p = cdOff;
    for (let i = 0; i < count; i++) {
      if (dv.getUint32(p, true) !== 0x02014b50) break;
      const method = dv.getUint16(p + 10, true);
      const csize = dv.getUint32(p + 20, true);
      const nameLen = dv.getUint16(p + 28, true);
      const extraLen = dv.getUint16(p + 30, true);
      const commentLen = dv.getUint16(p + 32, true);
      const localOff = dv.getUint32(p + 42, true);
      const name = new TextDecoder().decode(u8.subarray(p + 46, p + 46 + nameLen));
      out[name] = { method, csize, localOff };
      p += 46 + nameLen + extraLen + commentLen;
    }
    return { entries: out, dv, u8 };
  }

  async function readFile(buf) {
    const { entries, dv, u8 } = readEntries(buf);
    async function text(name) {
      const e = entries[name];
      if (!e) return null;
      const nl = dv.getUint16(e.localOff + 26, true);
      const el = dv.getUint16(e.localOff + 28, true);
      const start = e.localOff + 30 + nl + el;
      const raw = u8.subarray(start, start + e.csize);
      const bytes = e.method === 0 ? raw : await inflateRaw(raw);
      return new TextDecoder().decode(bytes);
    }
    const parser = new DOMParser();
    const wbXml = await text('xl/workbook.xml');
    if (!wbXml) throw new Error('No workbook found inside the file.');
    const wbDoc = parser.parseFromString(wbXml, 'application/xml');
    const relsXml = await text('xl/_rels/workbook.xml.rels');
    const rels = {};
    if (relsXml) {
      const rd = parser.parseFromString(relsXml, 'application/xml');
      rd.querySelectorAll('Relationship').forEach(r => { rels[r.getAttribute('Id')] = r.getAttribute('Target'); });
    }
    let shared = [];
    const ssXml = await text('xl/sharedStrings.xml');
    if (ssXml) {
      const sd = parser.parseFromString(ssXml, 'application/xml');
      shared = [...sd.querySelectorAll('si')].map(si =>
        [...si.querySelectorAll('t')].map(t => t.textContent).join(''));
    }
    const sheets = [];
    const sheetEls = [...wbDoc.querySelectorAll('sheets > sheet')];
    for (const sh of sheetEls) {
      const name = sh.getAttribute('name');
      const rid = sh.getAttribute('r:id') || sh.getAttribute('id');
      let target = rels[rid] || ('worksheets/sheet' + (sheets.length + 1) + '.xml');
      if (target.startsWith('/')) target = target.slice(1); else if (!target.startsWith('xl/')) target = 'xl/' + target;
      const sx = await text(target);
      if (!sx) continue;
      const doc = parser.parseFromString(sx, 'application/xml');
      const rows = [];
      doc.querySelectorAll('sheetData > row').forEach(rowEl => {
        const row = [];
        rowEl.querySelectorAll('c').forEach(c => {
          const ref = c.getAttribute('r') || '';
          const col = ref.replace(/[0-9]/g, '');
          let idx = 0;
          for (let i = 0; i < col.length; i++) idx = idx * 26 + (col.charCodeAt(i) - 64);
          idx -= 1;
          const t = c.getAttribute('t');
          let val = null;
          if (t === 's') {
            const v = c.querySelector('v');
            val = v ? shared[+v.textContent] : null;
          } else if (t === 'inlineStr') {
            val = [...c.querySelectorAll('is t')].map(x => x.textContent).join('');
          } else {
            const v = c.querySelector('v');
            if (v) { const n = Number(v.textContent); val = isFinite(n) ? n : v.textContent; }
          }
          if (val !== null && val !== '') row[idx] = val;
        });
        rows.push(row);
      });
      sheets.push({ name, rows });
    }
    return sheets;
  }
  window.readXlsx = readFile;
})();

function openPackEdit(pid) {
  if (!allowed('packs')) return;
  const p = P(pid); const o = (state.packPrice || {})[pid] || {};
  const F = [['litres', 'Litres', p.litres], ['lpc', 'Litres per carton', p.lpc],
    ['cq', 'Container qty', p.cq], ['cp', 'Container price', o.cp != null ? o.cp : p.cp],
    ['capq', 'Cap qty', p.capq], ['capp', 'Cap price', o.capp != null ? o.capp : p.capp],
    ['lq', 'Label qty', p.lq], ['lp', 'Label price', o.lp != null ? o.lp : p.lp],
    ['ctq', 'Carton qty', p.ctq], ['ctp', 'Carton price', o.ctp != null ? o.ctp : p.ctp]];
  const dlg = document.createElement('div');
  dlg.className = 'overlay';
  dlg.innerHTML = `<div class="modal">
    <h2>${esc(p.label)}</h2>
    <p class="muted small">Change any quantity or price. Packing cost per litre and every SKU in this pack recalculate.</p>
    <div class="grid2">${F.map(([k, label, v]) =>
      `<div><label>${label}</label><input id="pk_${k}" type="number" step="0.0001" value="${v}"></div>`).join('')}</div>
    <div class="modalbar"><button class="btn ghost" data-act="closepack">Cancel</button>
      <button class="btn" data-act="savepack" data-id="${pid}">Save</button></div>
  </div>`;
  document.body.appendChild(dlg);
  dlg.addEventListener('click', e => {
    const a = e.target.dataset.act;
    if (a === 'closepack') { dlg.remove(); return; }
    if (a === 'savepack') {
      const val = k => { const el = dlg.querySelector('#pk_' + k); return el ? parseFloat(el.value) : NaN; };
      const lines = [];
      // quantities and litres live on the pack itself
      ['litres', 'lpc', 'cq', 'capq', 'lq', 'ctq'].forEach(k => {
        const v = val(k); if (!isFinite(v) || near(v, p[k])) return;
        const nm = F.find(f => f[0] === k)[1];
        lines.push(p.label + ' ' + nm + ': ' + num(p[k], 4) + ' to ' + num(v, 4));
        audit('pack_size', p.label, nm, num(p[k], 4), num(v, 4), 'Pack', 'Edited on screen');
        p[k] = v;
      });
      // prices live as overrides so the base stays intact
      ['cp', 'capp', 'lp', 'ctp'].forEach(k => {
        const v = val(k); if (!isFinite(v)) return;
        const cur = (state.packPrice[pid] && state.packPrice[pid][k] != null) ? state.packPrice[pid][k] : p[k];
        if (near(cur, v)) return;
        const nm = F.find(f => f[0] === k)[1];
        state.packPrice = state.packPrice || {};
        state.packPrice[pid] = state.packPrice[pid] || {};
        state.packPrice[pid][k] = v;
        lines.push(p.label + ' ' + nm + ': Rs ' + money(cur) + ' to Rs ' + money(v));
        audit('pack_size', p.label, nm, 'Rs ' + money(cur), 'Rs ' + money(v), 'Pack', 'Edited on screen');
      });
      if (lines.length) newVersion('In-app — pack edited', lines.length + ' change' + (lines.length === 1 ? '' : 's'), lines);
      saveMaster(); save(); dlg.remove(); route();
    }
  });
}

/* ---------------- ad-hoc calculator ---------------- */
function ctxFromScenario(sc) {
  const ctx = Object.assign({ gradeOverride: {}, formOverride: {} }, ctxBase());
  for (const c of sc.changes) {
    if (c.type === 'MAT') ctx.matOverride[c.id] = Object.assign({}, ctx.matOverride[c.id], { price: c.value });
    if (c.type === 'GRADE') { ctx.gradeOverride[c.id] = ctx.gradeOverride[c.id] || {}; ctx.gradeOverride[c.id][c.field] = c.value; }
    if (c.type === 'FORM') { ctx.formOverride[c.grade] = ctx.formOverride[c.grade] || []; ctx.formOverride[c.grade].push({ mid: c.mat, pct: c.value }); }
    if (c.type === 'PACK') { ctx.packOverride[c.id] = ctx.packOverride[c.id] || {}; ctx.packOverride[c.id][c.field] = c.value; }
    if (c.type === 'MARGIN') ctx.marginRules = ctx.marginRules.concat([{ id: 9000 + Math.random(), type: c.mtype, scope: c.scope, brand: c.brand, grade: c.grade, pack: c.pack, sku: c.sku, value: c.value, seq: 9999 }]);
  }
  return ctx;
}
function scopeSkus(sc) {
  const s = sc.scope;
  if (s.kind === 'ALL') return DB.skus.slice().sort(byPack);
  if (s.kind === 'BRAND') return DB.skus.filter(x => x.brand === s.brand).sort(byPack);
  if (s.kind === 'GRADE') return DB.skus.filter(x => x.grade === +s.grade).sort(byPack);
  if (s.kind === 'PACK') return DB.skus.filter(x => x.pack === +s.pack).sort(byPack);
  if (s.kind === 'SKU') return DB.skus.filter(x => x.id === +s.sku);
  return DB.skus;
}
function viewScenario() {
  if (!allowed('scenario')) return denied();
  const cur = state.scenarios.find(s => s.id === window.__scen);
  if (!cur) {
    const list = state.scenarios.map(s => `<tr><td><b>${esc(s.name)}</b><div class="muted small">${esc(s.note || '')}</div></td>
      <td>${esc(s.created)}</td><td class="c">${s.changes.length}</td>
      <td class="r"><button class="btn ghost" data-act="openscen" data-id="${s.id}">Open</button>
      <button class="link" data-act="delscen" data-id="${s.id}">delete</button></td></tr>`).join('');
    return shell('Ad-hoc calculator', `
      <p class="muted small">Test formulation, raw material, packing and margin changes without touching a live price. Nothing here is an approved change.</p>
      <div class="bar"><button class="btn" data-act="newscen">New scenario</button></div>
      <div class="card">${state.scenarios.length ? `<table class="grid"><thead><tr><th>Scenario</th><th>Created</th><th class="c">Changes</th><th></th></tr></thead><tbody>${list}</tbody></table>` : '<p class="muted pad">No scenarios yet.</p>'}</div>`);
  }
  const ctx = ctxFromScenario(cur);
  const base = ctxBase();
  const skus = scopeSkus(cur);
  let totBase = 0, totNew = 0, changed = 0, sumL = 0, nL = 0;
  const rows = skus.map(s => {
    const a = E.sku(s.id, base), b = E.sku(s.id, ctx);
    totBase += a.packPrice; totNew += b.packPrice;
    sumL += (b.campInv - a.campInv); nL++;
    if (Math.abs(a.packPrice - b.packPrice) > 0.005) changed++;
    const d = b.packPrice - a.packPrice;
    const ma = (a.upMargin + a.cpMargin) / a.cost, mb = (b.upMargin + b.cpMargin) / b.cost;
    return `<tr class="${Math.abs(d) > 0.005 ? 'diff' : ''}"><td>${esc(s.desc)}</td><td>${esc(P(s.pack).label)}</td>
      <td class="r">${money(a.packPrice)}</td><td class="r">${money(b.packPrice)}</td>
      <td class="r ${d > 0 ? 'up' : d < 0 ? 'down' : ''}">${d ? (d > 0 ? '+' : '') + money(d) : '—'}</td>
      <td class="r">${pct(ma)}</td><td class="r">${pct(mb)}</td></tr>`;
  }).join('');
  const changeList = cur.changes.map((c, i) => `<li>${esc(changeText(c))} <button class="link" data-act="delchange" data-i="${i}">remove</button></li>`).join('');
  return shell('Scenario — ' + cur.name, `

        ${cur.changes.length ? `<ul class="changes">${changeList}</ul>` : '<p class="muted">No changes yet.</p>'}
        <button class="btn ghost" data-act="addchange" style="margin-top:10px">Add a change</button>
      </div>
      <div class="card pad">
        <h3>Effect</h3>
        <div class="stats tight">
          <div class="stat"><b>${changed}</b><span>SKUs change</span></div>
          <div class="stat"><b>${money(sumL / (nL || 1))}</b><span>Average change, Rs per litre</span></div>
          <div class="stat"><b>${totBase ? ((totNew / totBase - 1) * 100).toFixed(2) : '0'}%</b><span>Across the scope</span></div>
        </div>
      </div>
    </div>
    <div class="card"><table class="grid">
      <thead><tr><th>SKU</th><th>Pack</th><th class="r">Today</th><th class="r">Scenario</th><th class="r">Change</th><th class="r">Margin % today</th><th class="r">Margin % scenario</th></tr></thead>
      <tbody>${rows}</tbody></table></div>`, { print: true });
}
function scopeText(s) {
  if (s.kind === 'ALL') return 'Every SKU';
  if (s.kind === 'BRAND') return 'Brand ' + s.brand;
  if (s.kind === 'GRADE') return 'Product ' + G(+s.grade).code;
  if (s.kind === 'PACK') return 'Pack ' + P(+s.pack).label;
  if (s.kind === 'SKU') return 'One SKU';
  return '';
}
function changeText(c) {
  if (c.type === 'MAT') return 'Material price — ' + M(c.id).name + ' to Rs ' + num(c.value, 2);
  if (c.type === 'GRADE') return 'Grade — ' + G(c.id).code + ' ' + c.field + ' to ' + num(c.value, 4);
  if (c.type === 'FORM') return 'Formulation — ' + G(c.grade).code + ': ' + M(c.mat).name + ' to ' + (c.value * 100).toFixed(2) + '%';
  if (c.type === 'PACK') return 'Packing — ' + P(c.id).label + ' ' + c.field + ' to Rs ' + num(c.value, 2);
  if (c.type === 'MARGIN') return (c.mtype === 'UPLABS' ? 'Uplabs' : 'Camp') + ' margin to Rs ' + num(c.value, 2) + ' — ' + scopeLabel(c);
  return '';
}

function norm(x) { return String(x == null ? '' : x).toLowerCase().replace(/\s+/g, ' ').trim(); }
const isNum = v => typeof v === 'number' && isFinite(v);
const near = (a, b) => Math.abs((a || 0) - (b || 0)) < 1e-9;

function classifySheet(name) {
  const n = norm(name);
  if (/raw material|^materials?$/.test(n)) return 'MAT';
  if (/formulation/.test(n)) return 'FORM';
  if (/packing cost|pack cost/.test(n)) return 'PACKCOST';
  if (/^new packs?$|^packs?$|pack size/.test(n)) return 'PACK';
  if (/product|grade/.test(n)) return 'PROD';
  if (/^skus?$|new sku/.test(n)) return 'SKU';
  if (/margin/.test(n)) return 'MARGIN';
  return null;
}

async function handleUpload(file) {
  const out = { changes: [], errors: [], file: file.name };
  try {
    const sheets = await readXlsx(await file.arrayBuffer());
    const by = {}; sheets.forEach(sh => { const k = classifySheet(sh.name); if (k && !by[k]) by[k] = sh; });

    /* when was this file taken out of the app? the Read me sheet carries it */
    const readmeSheet = sheets.find(sh => /read ?me/i.test(sh.name));
    let fileStamp = null, fileDate = null;
    if (readmeSheet) {
      for (const row of readmeSheet.rows) {
        for (const cell of row) {
          const m = String(cell == null ? '' : cell).match(/taken from the app on\s+(.+)$/i);
          if (m) { fileStamp = m[1].trim(); fileDate = parseStamp(fileStamp); }
        }
        if (fileDate) break;
      }
    }
    out.fileStamp = fileStamp;
    const lastChange = lastChangeTime();
    if (fileDate && lastChange && fileDate.getTime() < lastChange - 1000) {
      const since = (state.audit || []).filter(a => { const d = parseStamp(a.ts); return d && d.getTime() > fileDate.getTime(); });
      out.stale = { fileStamp, lastChange: new Date(lastChange).toLocaleString('en-IN', { hour12: false }),
        hours: ((lastChange - fileDate.getTime()) / 3600000).toFixed(1), since: since.slice(0, 12), count: since.length };
    }
    const idx = (hdr, re) => hdr.findIndex(h => re.test(norm(h)));

    /* --- raw materials: header-driven so both the template and a downloaded master work --- */
    if (by.MAT) {
      const hdr = by.MAT.rows[0] || [];
      const iMat = Math.max(0, idx(hdr, /material/));
      const iNew = idx(hdr, /new price/);
      const iPrice = idx(hdr, /^price|current price|price rs/);
      const iDen = idx(hdr, /density/), iTr = idx(hdr, /transport/), iBasis = idx(hdr, /basis/);
      by.MAT.rows.slice(1).forEach(r => {
        const name = r[iMat]; if (name == null || name === '') return;
        let val = iNew >= 0 && isNum(r[iNew]) ? r[iNew] : (iPrice >= 0 && isNum(r[iPrice]) ? r[iPrice] : null);
        if (val == null) return;
        const m = DB.materials.find(x => norm(x.name) === norm(name));
        if (!m) {
          const density = iDen >= 0 && isNum(r[iDen]) ? r[iDen] : 1;
          const tr = iTr >= 0 && isNum(r[iTr]) ? r[iTr] : 0;
          const basis = iBasis >= 0 && /kg/.test(norm(r[iBasis])) ? 'KG' : 'L';
          out.changes.push({ kind: 'NEWMAT', name: String(name).trim(), price: val, density, transport: tr, basis,
            label: String(name).trim(), field: 'New material', from: null, to: val });
          return;
        }
        const cur = state.matPrice[m.id] != null ? state.matPrice[m.id] : m.price;
        if (near(cur, val)) return;
        out.changes.push({ kind: 'MAT', id: m.id, label: m.name, field: 'Price', from: cur, to: val });
      });
    }

    /* --- pack component prices --- */
    if (by.PACKCOST) {
      const hdr = by.PACKCOST.rows[0] || [];
      const iLbl = Math.max(0, idx(hdr, /pack/));
      const f = [['cp', idx(hdr, /container/)], ['capp', idx(hdr, /cap/)], ['lp', idx(hdr, /label/)], ['ctp', idx(hdr, /carton/)]];
      by.PACKCOST.rows.slice(1).forEach(r => {
        const label = r[iLbl]; if (label == null || label === '') return;
        const p = DB.packs.find(x => norm(x.label) === norm(label)) || DB.packs.find(x => norm(x.label).indexOf(norm(label)) === 0);
        if (!p) { out.errors.push('Pack not found: ' + label); return; }
        f.forEach(([key, i]) => {
          if (i < 0 || !isNum(r[i])) return;
          const cur = (state.packPrice[p.id] && state.packPrice[p.id][key] != null) ? state.packPrice[p.id][key] : p[key];
          if (near(cur, r[i])) return;
          out.changes.push({ kind: 'PACK', id: p.id, field: key, label: p.label + ' — ' + ({ cp: 'Container', capp: 'Cap', lp: 'Label', ctp: 'Carton' })[key], from: cur, to: r[i] });
        });
      });
    }

    /* --- packs: new ones, or changes to an existing one --- */
    if (by.PACK) {
      const hdr = by.PACK.rows[0] || [];
      const iLbl = Math.max(0, idx(hdr, /pack/));
      const iLit = idx(hdr, /litres/), iLpc = idx(hdr, /per ctn|carton/);
      const qty = [idx(hdr, /container qty/), idx(hdr, /container price/), idx(hdr, /cap qty/), idx(hdr, /cap price/),
        idx(hdr, /label qty/), idx(hdr, /label price/), idx(hdr, /carton qty/), idx(hdr, /carton price/)];
      by.PACK.rows.slice(1).forEach(r => {
        const label = r[iLbl]; if (label == null || label === '') return;
        const nums = qty.map(i => i >= 0 && isNum(r[i]) ? r[i] : null);
        const existing = DB.packs.find(x => norm(x.label) === norm(label));
        if (existing) {
          const keys = ['cq', 'cp', 'capq', 'capp', 'lq', 'lp', 'ctq', 'ctp'];
          const PRICE_KEYS = ['cp', 'capp', 'lp', 'ctp'];
          const NAMES = { cp: 'Container', capp: 'Cap', lp: 'Label', ctp: 'Carton' };
          keys.forEach((k, j) => {
            if (nums[j] == null) return;
            // when a Packing Costs sheet is present it is the authority for prices
            if (by.PACKCOST && PRICE_KEYS.includes(k)) return;
            const cur = (state.packPrice[existing.id] && state.packPrice[existing.id][k] != null) ? state.packPrice[existing.id][k] : existing[k];
            if (near(cur, nums[j])) return;
            out.changes.push({ kind: 'PACK', id: existing.id, field: k, label: existing.label + ' — ' + (NAMES[k] || k), from: cur, to: nums[j] });
          });
          if (iLit >= 0 && isNum(r[iLit]) && !near(existing.litres, r[iLit]))
            out.changes.push({ kind: 'PACKLIT', id: existing.id, label: existing.label, field: 'Litres', from: existing.litres, to: r[iLit] });
          if (iLpc >= 0 && isNum(r[iLpc]) && !near(existing.lpc, r[iLpc]))
            out.changes.push({ kind: 'PACKLPC', id: existing.id, label: existing.label, field: 'Ltrs per ctn', from: existing.lpc, to: r[iLpc] });
          return;
        }
        const litres = iLit >= 0 ? r[iLit] : null, lpc = iLpc >= 0 ? r[iLpc] : null;
        if (!isNum(litres) || litres <= 0) { out.errors.push('New pack needs litres: ' + label); return; }
        if (!isNum(lpc) || lpc <= 0) { out.errors.push('New pack needs litres per carton: ' + label); return; }
        out.changes.push({ kind: 'NEWPACK', label: String(label).trim(), field: 'New pack', from: null, to: litres,
          pack: { label: String(label).trim(), key: String(label).trim(), litres, lpc,
            cq: nums[0] || 0, cp: nums[1] || 0, capq: nums[2] || 0, capp: nums[3] || 0,
            lq: nums[4] || 0, lp: nums[5] || 0, ctq: nums[6] || 0, ctp: nums[7] || 0 } });
      });
    }

    /* --- products: new ones, or changes to an existing one --- */
    const formRows = by.FORM ? by.FORM.rows.slice(1) : [];
    const newCodes = [];
    if (by.PROD) {
      const hdr = by.PROD.rows[0] || [];
      const iCode = Math.max(0, idx(hdr, /oil code/)), iDesc = idx(hdr, /description/), iCat = idx(hdr, /category/),
            iGrp = idx(hdr, /group/), iDen = idx(hdr, /density/), iLoss = idx(hdr, /loss/), iConv = idx(hdr, /conversion/);
      by.PROD.rows.slice(1).forEach(r => {
        const code = r[iCode]; if (code == null || code === '') return;
        const density = iDen >= 0 ? r[iDen] : null;
        if (!isNum(density) || density <= 0) { out.errors.push('Product needs a density: ' + code); return; }
        const loss = iLoss >= 0 && isNum(r[iLoss]) ? (r[iLoss] <= 0.05 ? r[iLoss] : r[iLoss] / 100) : null;
        const conv = iConv >= 0 && isNum(r[iConv]) ? r[iConv] : null;
        const existing = DB.grades.find(x => norm(x.code) === norm(code));
        const form = []; const seen = new Set();
        formRows.forEach(fr => {
          if (fr[0] == null || norm(fr[0]) !== norm(code)) return;
          const matName = String(fr[1] == null ? '' : fr[1]).trim();
          if (!matName || seen.has(norm(matName))) return;
          seen.add(norm(matName));
          const known = DB.materials.some(x => norm(x.name) === norm(matName)) ||
                        out.changes.some(c => c.kind === 'NEWMAT' && norm(c.name) === norm(matName));
          if (!known) { out.errors.push('Material not found for ' + code + ': ' + matName); return; }
          if (!isNum(fr[2])) return;
          form.push([matName, fr[2]]);
        });
        // decide once per product whether the sheet is in percent or in fractions
        const rawTotal = form.reduce((a, f) => a + f[1], 0);
        if (rawTotal > 1.5) form.forEach(f => { f[1] = f[1] / 100; });
        const total = form.reduce((a, f) => a + f[1], 0);
        if (form.length && Math.abs(total - 1) > 0.001) {
          out.errors.push('Formulation for ' + code + ' totals ' + (total * 100).toFixed(2) + '% — it must be 100%'); return;
        }
        if (!existing) {
          if (!form.length) { out.errors.push('New product ' + code + ' has no formulation'); return; }
          newCodes.push(String(code).trim());
          out.changes.push({ kind: 'NEWGRADE', label: String(code).trim(), field: 'New product', from: null, to: form.length,
            grade: { code: String(code).trim(), desc: (iDesc >= 0 ? r[iDesc] : '') || '', cat: (iCat >= 0 ? r[iCat] : '') || '',
              grp: (iGrp >= 0 ? r[iGrp] : '') || '', density, loss: loss == null ? 0.002 : loss,
              conv: conv == null ? 0 : conv, form } });
          return;
        }
        // existing product — record only what actually differs
        const diffs = [];
        if (iDesc >= 0 && r[iDesc] != null && norm(r[iDesc]) !== norm(existing.desc)) diffs.push(['desc', 'Description', existing.desc, r[iDesc]]);
        if (iCat >= 0 && r[iCat] != null && norm(r[iCat]) !== norm(existing.cat)) diffs.push(['cat', 'Category', existing.cat, r[iCat]]);
        if (iGrp >= 0 && r[iGrp] != null && norm(r[iGrp]) !== norm(existing.grp)) diffs.push(['grp', 'Base oil group', existing.grp, r[iGrp]]);
        if (!near(density, existing.density)) diffs.push(['density', 'Density', existing.density, density]);
        if (loss != null && !near(loss, existing.loss)) diffs.push(['loss', 'Process loss %', +(existing.loss * 100).toFixed(3), +(loss * 100).toFixed(3)]);
        if (conv != null && !near(conv, existing.conv)) diffs.push(['conv', 'Conversion Rs/L', existing.conv, conv]);
        if (form.length) {
          const old = existing.form.map(([mid, pct]) => [norm((DB.materials.find(m => m.id === mid) || {}).name), pct]);
          const same = old.length === form.length && form.every(([n, p]) => {
            const o = old.find(x => x[0] === norm(n)); return o && near(o[1], p);
          });
          if (!same) diffs.push(['form', 'Formulation', old.length + ' materials', form.length + ' materials']);
        }
        diffs.forEach(([field, label, from, to]) => out.changes.push({
          kind: field === 'form' ? 'UPDGRADEFORM' : 'UPDGRADE', id: existing.id, field, label: existing.code + ' — ' + label,
          from: typeof from === 'number' ? from : String(from), to: typeof to === 'number' ? to : String(to), form: field === 'form' ? form : undefined }));
      });
    }

    /* --- SKUs: new ones, or changes to an existing one --- */
    if (by.SKU) {
      const hdr = by.SKU.rows[0] || [];
      const iB = Math.max(0, idx(hdr, /brand/)), iC = idx(hdr, /oil code/), iP = idx(hdr, /pack/),
            iD = idx(hdr, /description|sku/), iH = idx(hdr, /hsn/), iG = idx(hdr, /gst/);
      by.SKU.rows.slice(1).forEach(r => {
        const brand = r[iB], code = r[iC], packLabel = r[iP], desc = r[iD];
        if (brand == null || brand === '') return;
        if (!['camp', 'ciifrol', 'gobyk'].includes(norm(brand))) { out.errors.push('Unknown brand: ' + brand); return; }
        if (desc == null || desc === '') { out.errors.push('SKU needs a description (' + brand + ')'); return; }
        const g = DB.grades.find(x => norm(x.code) === norm(code));
        const p = DB.packs.find(x => norm(x.label) === norm(packLabel));
        const gid = g ? g.id : 'NEW:' + String(code).trim();
        const pid = p ? p.id : 'NEW:' + String(packLabel).trim();
        if (!g && !newCodes.some(c => norm(c) === norm(code))) { out.errors.push('Product not found for SKU ' + desc + ': ' + code); return; }
        if (!p && !out.changes.some(c => c.kind === 'NEWPACK' && norm(c.pack.label) === norm(packLabel))) {
          out.errors.push('Pack not found for SKU ' + desc + ': ' + packLabel); return;
        }
        const hsn = iH >= 0 && isNum(r[iH]) ? r[iH] : 27101980;
        const gst = iG >= 0 && isNum(r[iG]) ? (r[iG] >= 1 ? r[iG] / 100 : r[iG]) : 0.18;
        const existing = DB.skus.find(x => norm(x.desc) === norm(desc));
        if (!existing) {
          out.changes.push({ kind: 'NEWSKU', label: String(desc).trim(), field: 'New SKU', from: null, to: 1,
            sku: { brand: String(brand).trim(), desc: String(desc).trim(), grade: gid, pack: pid, hsn, gst } });
          return;
        }
        const diffs = [];
        if (norm(existing.brand) !== norm(brand)) diffs.push(['brand', 'Brand', existing.brand, brand]);
        if (typeof gid === 'number' && existing.grade !== gid) diffs.push(['grade', 'Oil code', (DB.grades.find(x => x.id === existing.grade) || {}).code, code]);
        if (typeof pid === 'number' && existing.pack !== pid) diffs.push(['pack', 'Pack', (DB.packs.find(x => x.id === existing.pack) || {}).label, packLabel]);
        if (!near(existing.hsn, hsn)) diffs.push(['hsn', 'HSN', existing.hsn, hsn]);
        if (!near(existing.gst, gst)) diffs.push(['gst', 'GST %', +(existing.gst * 100).toFixed(2), +(gst * 100).toFixed(2)]);
        diffs.forEach(([field, label, from, to]) => out.changes.push({
          kind: 'UPDSKU', id: existing.id, field, label: existing.desc + ' — ' + label, from, to,
          raw: field === 'gst' ? gst : field === 'hsn' ? hsn : field === 'grade' ? gid : field === 'pack' ? pid : to }));
      });
    }

    /* --- margins --- */
    if (by.MARGIN) {
      const hdr = by.MARGIN.rows[0] || [];
      const iT = Math.max(0, idx(hdr, /margin/)), iS = idx(hdr, /scope/), iTar = idx(hdr, /target/), iV = idx(hdr, /value|new value/);
      by.MARGIN.rows.slice(1).forEach(r => {
        const type = norm(r[iT]), scopeRaw = norm(r[iS]), target = r[iTar];
        const val = iV >= 0 ? r[iV] : r[3];
        if (!type || !scopeRaw || !isNum(val)) return;
        const mtype = type.startsWith('up') ? 'UPLABS' : type.startsWith('camp') ? 'CAMP' : null;
        if (!mtype) { out.errors.push('Margin type not understood: ' + r[iT]); return; }
        const rule = { id: 0, type: mtype, value: val, seq: 0, from: new Date().toISOString().slice(0, 10), reason: 'Excel upload' };
        if (scopeRaw === 'all' || scopeRaw === 'universal' || scopeRaw === 'every sku') rule.scope = 'GLOBAL';
        else if (scopeRaw === 'brand') { rule.scope = 'BRAND'; rule.brand = String(target || '').trim(); }
        else if (scopeRaw === 'product') {
          const g = DB.grades.find(x => norm(x.code) === norm(target));
          if (!g && !newCodes.some(c => norm(c) === norm(target))) { out.errors.push('Product not found: ' + target); return; }
          rule.scope = 'PRODUCT'; rule.grade = g ? g.id : ('NEW:' + String(target).trim());
        } else if (scopeRaw === 'pack') {
          const p = DB.packs.find(x => norm(x.label) === norm(target)) || DB.packs.find(x => norm(x.label).indexOf(norm(target)) === 0);
          if (!p && !out.changes.some(c => c.kind === 'NEWPACK' && norm(c.pack.label) === norm(target))) { out.errors.push('Pack not found: ' + target); return; }
          rule.scope = 'PACK'; rule.pack = p ? p.id : ('NEW:' + String(target).trim());
        } else if (scopeRaw === 'sku') {
          const sk = DB.skus.find(x => norm(x.desc) === norm(target));
          if (!sk) { out.errors.push('SKU not found: ' + target); return; }
          rule.scope = 'SKU'; rule.sku = sk.id;
        } else { out.errors.push('Scope not understood: ' + r[iS]); return; }
        const probe = { brand: rule.brand, grade: typeof rule.grade === 'number' ? rule.grade : -1,
          pack: typeof rule.pack === 'number' ? rule.pack : -1, id: rule.sku };
        const current = E.margin(mtype, probe, ctxBase()).value;
        if (near(current, val)) return;
        out.changes.push({ kind: 'MARGIN', rule, field: 'Value', label: (mtype === 'UPLABS' ? 'Uplabs' : 'Camp') + ' margin — ' + scopeLabel(rule), from: current, to: val });
      });
    }

    const seenPack = new Set();
    out.changes = out.changes.filter(c => {
      if (c.kind !== 'PACK') return true;
      const k = c.id + '|' + c.field;
      if (seenPack.has(k)) return false;
      seenPack.add(k); return true;
    });
    if (!Object.keys(by).length) out.errors.push('No recognisable sheet found. Use the template or a downloaded master.');
  } catch (err) { out.errors.push(err.message || String(err)); }
  window.__upload = out;
  window.__staleOK = false;
  route();
}

function applyUpload() {
  if (!allowed('upload')) return;
  window.__staleOK = false;
  const u = window.__upload; if (!u || !u.changes.length) return;
  const lines = [];
  const nextId = arr => arr.reduce((a, x) => Math.max(a, x.id), 0) + 1;

  u.changes.filter(c => c.kind === 'NEWMAT').forEach(c => {
    const id = nextId(DB.materials);
    DB.materials.push({ id, name: c.name, price: c.price, basis: c.basis, density: c.density, transport: c.transport, landed: 0 });
    lines.push('New raw material ' + c.name + ' at Rs ' + money(c.price));
    audit('material', c.name, 'New material', '', 'Rs ' + money(c.price), 'Excel upload', 'Added from ' + u.file);
  });
  u.changes.filter(c => c.kind === 'NEWPACK').forEach(c => {
    const id = nextId(DB.packs);
    DB.packs.push(Object.assign({ id }, c.pack));
    lines.push('New pack ' + c.pack.label + ' (' + c.pack.litres + ' L)');
    audit('pack_size', c.pack.label, 'New pack', '', c.pack.litres + ' L', 'Excel upload', 'Added from ' + u.file);
  });
  u.changes.filter(c => c.kind === 'PACKLIT').forEach(c => {
    const p = DB.packs.find(x => x.id === c.id); p.litres = c.to;
    lines.push(c.label + ' litres ' + c.from + ' to ' + c.to);
    audit('pack_size', c.label, 'Litres', c.from, c.to, 'Excel upload', 'Uploaded in ' + u.file);
  });
  u.changes.filter(c => c.kind === 'PACKLPC').forEach(c => {
    const p = DB.packs.find(x => x.id === c.id); p.lpc = c.to;
    lines.push(c.label + ' litres per carton ' + c.from + ' to ' + c.to);
    audit('pack_size', c.label, 'Ltrs per ctn', c.from, c.to, 'Excel upload', 'Uploaded in ' + u.file);
  });
  u.changes.filter(c => c.kind === 'NEWGRADE').forEach(c => {
    const id = nextId(DB.grades);
    const form = c.grade.form.map(([name, pct]) => { const m = DB.materials.find(x => norm(x.name) === norm(name)); return m ? [m.id, pct] : null; }).filter(Boolean);
    DB.grades.push({ id, code: c.grade.code, desc: c.grade.desc, cat: c.grade.cat, grp: c.grade.grp,
      density: c.grade.density, loss: c.grade.loss, conv: c.grade.conv, form });
    lines.push('New product ' + c.grade.code + ' with ' + form.length + ' materials');
    audit('grade', c.grade.code, 'New product', '', c.grade.desc || c.grade.code, 'Excel upload', 'Added from ' + u.file);
  });
  u.changes.filter(c => c.kind === 'UPDGRADE' || c.kind === 'UPDGRADEFORM').forEach(c => {
    const g = DB.grades.find(x => x.id === c.id); if (!g) return;
    if (c.kind === 'UPDGRADEFORM') {
      g.form = c.form.map(([name, pct]) => { const m = DB.materials.find(x => norm(x.name) === norm(name)); return m ? [m.id, pct] : null; }).filter(Boolean);
    } else if (c.field === 'loss') g.loss = c.to / 100;
    else g[c.field] = c.to;
    lines.push(c.label + ': ' + c.from + ' to ' + c.to);
    audit('grade', c.label, c.field, c.from, c.to, 'Excel upload', 'Uploaded in ' + u.file);
  });
  const resolveGrade = g => typeof g === 'number' ? g : (DB.grades.find(x => norm(x.code) === norm(String(g).replace('NEW:', ''))) || {}).id;
  const resolvePack = p => typeof p === 'number' ? p : (DB.packs.find(x => norm(x.label) === norm(String(p).replace('NEW:', ''))) || {}).id;
  u.changes.filter(c => c.kind === 'NEWSKU').forEach(c => {
    const id = nextId(DB.skus);
    DB.skus.push({ id, code: 'SKU' + String(id).padStart(4, '0'), desc: c.sku.desc, brand: c.sku.brand,
      grade: resolveGrade(c.sku.grade), pack: resolvePack(c.sku.pack), hsn: c.sku.hsn, gst: c.sku.gst });
    lines.push('New SKU ' + c.sku.desc + ' (' + c.sku.brand + ')');
    audit('sku', c.sku.desc, 'New SKU', '', c.sku.brand, 'Excel upload', 'Added from ' + u.file);
  });
  u.changes.filter(c => c.kind === 'UPDSKU').forEach(c => {
    const s = DB.skus.find(x => x.id === c.id); if (!s) return;
    s[c.field] = c.raw !== undefined ? c.raw : c.to;
    lines.push(c.label + ': ' + c.from + ' to ' + c.to);
    audit('sku', c.label, c.field, c.from, c.to, 'Excel upload', 'Uploaded in ' + u.file);
  });
  u.changes.filter(c => c.kind === 'MAT').forEach(c => {
    state.matPrice[c.id] = c.to;
    lines.push(M(c.id).name + ' price Rs ' + money(c.from) + ' to Rs ' + money(c.to));
    audit('material', c.label, 'Price', 'Rs ' + money(c.from), 'Rs ' + money(c.to), 'Excel upload', 'Uploaded in ' + u.file);
  });
  u.changes.filter(c => c.kind === 'PACK').forEach(c => {
    state.packPrice = state.packPrice || {};
    state.packPrice[c.id] = state.packPrice[c.id] || {};
    state.packPrice[c.id][c.field] = c.to;
    lines.push(c.label + ' Rs ' + money(c.from) + ' to Rs ' + money(c.to));
    audit('pack_size', c.label, 'Price', 'Rs ' + money(c.from), 'Rs ' + money(c.to), 'Excel upload', 'Uploaded in ' + u.file);
  });
  u.changes.filter(c => c.kind === 'MARGIN').forEach(c => {
    const r = Object.assign({}, c.rule, { id: ++state.seq, seq: state.seq });
    r.grade = typeof r.grade === 'number' ? r.grade : resolveGrade(r.grade);
    r.pack = typeof r.pack === 'number' ? r.pack : resolvePack(r.pack);
    state.marginRules.push(r);
    lines.push(c.label + ' Rs ' + money(c.from) + ' to Rs ' + money(c.to));
    audit('margin_rule', c.label, 'Value', 'Rs ' + money(c.from), 'Rs ' + money(c.to), scopeLabel(r), 'Uploaded in ' + u.file);
  });

  saveMaster();
  const v = newVersion('Excel upload — ' + u.file, lines.length + ' change' + (lines.length === 1 ? '' : 's'), lines);
  audit('upload', u.file, 'Version ' + v.id, '', v.summary, 'Excel upload', 'Applied from ' + u.file);
  save();
  window.__upload = null;
  alert('Version ' + v.id + ' applied: ' + v.summary + '.');
  route();
}

function fmtVal(v, field) {
  const small = /density|loss|litres|ctn/i.test(String(field || ''));
  return small ? Number(v).toFixed(4) : money(v);
}

function changesOnDevice() {

function exportChanges() {
  if (!allowed('sync')) return;
  const payload = {
    app: 'camp-costing', version: 1, exported: nowStamp(),
    device: (navigator.userAgent || '').slice(0, 60),
    matPrice: state.matPrice || {}, packPrice: state.packPrice || {},
    marginRules: state.marginRules || [], audit: state.audit || []
  };
  const d = new Date();
  const stamp = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0') + '_' +
    String(d.getHours()).padStart(2, '0') + String(d.getMinutes()).padStart(2, '0');

async function readChanges(file) {
  const txt = await file.text();
  let data;
  try { data = JSON.parse(txt); } catch (e) { window.__sync = { error: 'That file is not a changes file exported by this app.' }; route(); return; }
  if (!data || data.app !== 'camp-costing') { window.__sync = { error: 'That file is not a changes file exported by this app.' }; route(); return; }
  const mine = { matPrice: state.matPrice || {}, packPrice: state.packPrice || {}, rules: state.marginRules || [] };
  const fp = r => [r.type, r.scope, r.brand || '', r.grade || '', r.pack || '', r.sku || '', r.value].join('|');
  const haveRules = new Set(mine.rules.map(fp));
  const newMats = [], newPacks = [], newRules = [];
  Object.entries(data.matPrice || {}).forEach(([id, v]) => {
    const cur = mine.matPrice[id];
    if (cur == null || Math.abs(cur - v) > 1e-9) newMats.push({ id: +id, from: cur, to: v });
  });
  Object.entries(data.packPrice || {}).forEach(([id, obj]) => {
    Object.entries(obj).forEach(([f, v]) => {
      const cur = mine.packPrice[id] && mine.packPrice[id][f];
      if (cur == null || Math.abs(cur - v) > 1e-9) newPacks.push({ id: +id, field: f, from: cur, to: v });
    });
  });
  (data.marginRules || []).forEach(r => { if (!haveRules.has(fp(r))) newRules.push(r); });
  window.__sync = { file: file.name, exported: data.exported, newMats, newPacks, newRules, audit: data.audit || [] };
  route();
}
function applySync() {
  if (!allowed('sync')) return;
  const s = window.__sync; if (!s || s.error) return;
  let n = 0;
  s.newMats.forEach(m => { state.matPrice[m.id] = m.to; n++;
    audit('material', M(m.id).name, 'Price', m.from == null ? '(unset)' : 'Rs ' + money(m.from), 'Rs ' + money(m.to), 'Synced from another device', 'Merged from ' + s.file); });
  s.newPacks.forEach(p => { state.packPrice = state.packPrice || {}; state.packPrice[p.id] = state.packPrice[p.id] || {};
    state.packPrice[p.id][p.field] = p.to; n++;
    audit('pack_size', P(p.id).label, p.field, p.from == null ? '(unset)' : 'Rs ' + money(p.from), 'Rs ' + money(p.to), 'Synced from another device', 'Merged from ' + s.file); });
  s.newRules.forEach(r => { state.marginRules.push(Object.assign({}, r, { id: ++state.seq, seq: state.seq })); n++;
    audit('margin_rule', scopeLabel(r), 'Value', '', 'Rs ' + money(r.value), scopeLabel(r), 'Merged from ' + s.file); });
  // merge the other device's history so the change log stays complete
  const seen = new Set(state.audit.map(a => [a.ts, a.table, a.record, a.field, a.new].join('|')));
  (s.audit || []).forEach(a => { const k = [a.ts, a.table, a.record, a.field, a.new].join('|');
    if (!seen.has(k)) { state.audit.push(a); seen.add(k); } });
  state.audit.sort((a, b) => String(b.ts).localeCompare(String(a.ts)));
  const slines = [
    ...s.newMats.map(m => M(m.id).name + ' price to Rs ' + money(m.to)),
    ...s.newPacks.map(p => P(p.id).label + ' ' + p.field + ' to Rs ' + money(p.to)),
    ...s.newRules.map(r => (r.type === 'UPLABS' ? 'Uplabs' : 'Camp') + ' margin Rs ' + money(r.value) + ' — ' + scopeLabel(r))];
  newVersion('Sync — ' + s.file, slines.length + ' change' + (slines.length === 1 ? '' : 's'), slines);
  audit('sync', s.file, 'Summary', '', n + ' change' + (n === 1 ? '' : 's') + ' merged', 'Sync', 'From ' + (s.exported || 'another device'));
  save(); window.__sync = null;
  alert(n + ' change' + (n === 1 ? '' : 's') + ' merged into this copy.');
  route();
}

/* ---------------- standalone costing workbooks (formula-linked) ---------------- */
function coreSheets(gradeIds, packIds) {
  const ctx = ctxBase();
  const F = f => ({ f });
  const grades = DB.grades.filter(g => gradeIds.includes(g.id));
  const packs = DB.packs.filter(p => packIds.includes(p.id));
  const usedMat = new Set();
  grades.forEach(g => E.formulation(g.id, ctx).forEach(r => usedMat.add(r.mid)));
  const mats = DB.materials.filter(m => usedMat.has(m.id));

  const raw = [['Material', 'Price', 'Density', 'Inbound transport', 'Basis', 'Landed Rs/kg']];
  mats.forEach(m => { const x = E.matOf(m, ctx); const r = raw.length + 1;
    raw.push([m.name, x.price, x.density, x.transport, m.basis === 'KG' ? 'per kg' : 'per litre',
      F(`IF(E${r}="per kg",B${r},B${r}/C${r})+D${r}`)]); });
  const rawLast = raw.length;

  const form = [['Oil Code', 'Material', '% by weight', 'Landed Rs/kg', 'Contribution Rs/kg']];
  grades.forEach(g => { const b = E.blend(g.id, ctx);
    b.lines.slice().sort((x, y) => y.pct - x.pct).forEach(l => { const r = form.length + 1;
      form.push([g.code, l.mat.name, +(l.pct * 100).toFixed(4),
        F(`IFERROR(INDEX('Raw Materials'!$F$2:$F$${rawLast},MATCH($B${r},'Raw Materials'!$A$2:$A$${rawLast},0)),0)`),
        F(`C${r}/100*D${r}`)]); }); });
  const formLast = form.length;

  const prods = [['Oil Code', 'Description', 'Category', 'Base oil group', 'Density', 'Process loss %', 'Conversion Rs/L',
    'Blend cost Rs/kg', 'RM cost Rs/L', 'Final bulk Rs/L']];
  grades.forEach(g => { const b = E.blend(g.id, ctx); const r = prods.length + 1;
    prods.push([g.code, g.desc, g.cat, g.grp, b.density, +(b.loss * 100).toFixed(3), b.conv,
      F(`SUMIFS(Formulations!$E$2:$E$${formLast},Formulations!$A$2:$A$${formLast},$A${r})`),
      F(`E${r}*H${r}`), F(`I${r}*(1+F${r}/100)+G${r}`)]); });
  const prodLast = prods.length;

  const pk = [['Pack', 'Litres', 'Ltrs per ctn', 'Container qty', 'Container price', 'Cap qty', 'Cap price',
    'Label qty', 'Label price', 'Carton qty', 'Carton price', 'Cost per carton', 'Per litre']];
  packs.forEach(p => { const o = (state.packPrice || {})[p.id] || {}; const r = pk.length + 1;
    pk.push([p.label, p.litres, p.lpc, p.cq, o.cp != null ? o.cp : p.cp, p.capq, o.capp != null ? o.capp : p.capp,
      p.lq, o.lp != null ? o.lp : p.lp, p.ctq, o.ctp != null ? o.ctp : p.ctp,
      F(`D${r}*E${r}+F${r}*G${r}+H${r}*I${r}+J${r}*K${r}`), F(`L${r}/C${r}`)]); });
  const packLast = pk.length;

  return { sheets: [
    { name: 'Raw Materials', rows: raw }, { name: 'Formulations', rows: form },
    { name: 'Products', rows: prods, hiddenCols: [7] }, { name: 'Packs', rows: pk }],
    rawLast, formLast, prodLast, packLast };
}

function exportTrace(skuId) {
  if (!allowed('trace')) return;
  const ctx = ctxBase();
  const r = E.sku(skuId, ctx), s = r.sku, g = G(s.grade), p = P(s.pack);
  const c = coreSheets([s.grade], [s.pack]);
  const F = f => ({ f });

  const rows = [['Cost trace — ' + s.desc], ['Brand', s.brand], ['Oil code', g.code], ['Pack', p.label],
    ['HSN', s.hsn], ['GST %', +(s.gst * 100).toFixed(2)], ['Taken from the app on', nowStamp()], [],
    ['Line', 'Value', 'How it is calculated']];
  const R = { gst: 6 };
  const put = (key, label, val, how) => { rows.push([label, val, how || '']); R[key] = rows.length; };

  put('blend', 'Blend cost per kg',
    F(`SUMIFS(Formulations!$E$2:$E$${c.formLast},Formulations!$A$2:$A$${c.formLast},"${g.code}")`),
    'Sum of the contributions on the Formulations sheet');
  put('dens', 'Density', r.blend.density, 'Lab measured, held on Products');
  put('rmL', 'RM cost per litre', F(`B${R.blend}*B${R.dens}`), 'Blend cost per kg x density');
  put('loss', 'Process loss %', +(r.blend.loss * 100).toFixed(3), '');
  put('afterLoss', 'After loss', F(`B${R.rmL}*(1+B${R.loss}/100)`), '');
  put('conv', 'Conversion Rs/L', r.blend.conv, 'Blending and transport charge');
  put('bulk', 'Final bulk cost per litre', F(`B${R.afterLoss}+B${R.conv}`), '');
  put('packL', 'Packing cost per litre',
    F(`IFERROR(INDEX(Packs!$M$2:$M$${c.packLast},MATCH("${p.label}",Packs!$A$2:$A$${c.packLast},0)),0)`),
    'Cost per carton divided by litres per carton, from Packs');
  put('skuCost', 'SKU cost per litre', F(`B${R.bulk}+B${R.packL}`), 'Bulk plus packing');
  put('upM', 'Uplabs margin', +r.upMargin.toFixed(2), 'Resolved by the app from the margin rules');
  put('upBasic', 'Uplabs basic per litre', F(`B${R.skuCost}+B${R.upM}`), '');
  put('gstL', 'GST per litre', F(`B${R.upBasic}*B${R.gst}/100`), '');
  put('upInv', 'Uplabs invoice per litre', F(`B${R.upBasic}+B${R.gstL}`), '');
  put('cpM', 'Camp margin', +r.cpMargin.toFixed(2), '');
  put('campBasic', 'Camp basic per litre', F(`B${R.upBasic}+B${R.cpM}`), 'Margin added to the ex-GST basic, not to the invoice');
  put('netL', 'Net per litre incl GST', F(`B${R.campBasic}*(1+B${R.gst}/100)`), '');
  put('litres', 'Pack litres', p.litres, '');
  put('netPack', 'Net per pack incl GST', F(`B${R.netL}*B${R.litres}`), '');
  put('mrp', 'Suggested MRP',
    F(`MROUND(B${R.netPack}*IF(B${R.litres}<=1,2.44,IF(B${R.litres}<=10,2.38,IF(B${R.litres}<=50,1.5,1.15))),IF(B${R.netPack}*IF(B${R.litres}<=1,2.44,IF(B${R.litres}<=10,2.38,IF(B${R.litres}<=50,1.5,1.15)))<1000,5,100))`),
    'Landed pack price x markup band, rounded');

  const sheets = [{ name: 'Cost Trace', rows }].concat(c.sheets);
  download('Cost_trace_' + String(s.desc).replace(/[^A-Za-z0-9]+/g, '_').slice(0, 40) + '.xlsx', buildXlsx(sheets));
}

/* ---------------- exports ---------------- */
function download(name, bytes, mime) {
  const blob = new Blob([bytes], { type: mime || 'application/octet-stream' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
function exportPrices(custId) {

function formulationRows(gid, ctx) {

    const sc = dlg.querySelector('#w-scope').value;
    const t = dlg.querySelector('#w-targets');
    const opts = (arr) => arr.map(o => `<option value="${o.v}">${esc(o.t)}</option>`).join('');
    let h = '';
    if (sc === 'BRAND') h = `<label>Brand</label><select id="w-brand">${opts(['Camp', 'Ciifrol', 'Gobyk'].map(b => ({ v: b, t: b })))}</select>`;
    if (sc === 'PRODUCT' || sc === 'PRODUCT_PACK') h = `<label>Product</label><select id="w-grade">${opts(DB.grades.map(g => ({ v: g.id, t: g.code + ' — ' + g.desc })))}</select>`;
    if (sc === 'PACK' || sc === 'PRODUCT_PACK') h = `<label>Pack size</label><select id="w-pack">${opts(DB.packs.map(p => ({ v: p.id, t: p.label + ' (' + DB.skus.filter(s => s.pack === p.id).length + ' SKUs)' })))}</select>`;
    if (sc === 'SKU') h = `<label>SKU</label><select id="w-sku">${opts(DB.skus.map(s => ({ v: s.id, t: s.desc })))}</select>`;
    t.innerHTML = h;
    preview();
  };
  const preview = () => {
    const type = dlg.querySelector('#w-type').value;
    const val = parseFloat(dlg.querySelector('#w-value').value) || 0;
    const sc = dlg.querySelector('#w-scope').value;
    const pick = id => { const el = dlg.querySelector('#' + id); return el ? +el.value : undefined; };
    const brand = dlg.querySelector('#w-brand') ? dlg.querySelector('#w-brand').value : undefined;
    const grade = pick('w-grade'), pack = pick('w-pack'), sku = pick('w-sku');
    const rule = { id: 9999, type, scope: sc, value: val, brand, grade, pack, sku, seq: 9999 };
    const ctxNew = { matPrice: state.matPrice, marginRules: state.marginRules.concat([rule]) };
    let n = 0, before = null, after = null;
    const sample = [];
    DB.skus.forEach(s => {
      const a = E.margin(type, s, ctxBase()), b = E.margin(type, s, ctxNew);
      if (Math.abs(a.value - b.value) > 0.001) { n++; if (sample.length < 3) sample.push(s.desc); }
    });
    const one = DB.skus.find(s => {
      if (sc === 'SKU') return s.id === sku;
      if (sc === 'BRAND') return s.brand === brand;
      if (sc === 'PRODUCT') return s.grade === grade;
      if (sc === 'PACK') return s.pack === pack;
      if (sc === 'PRODUCT_PACK') return s.grade === grade && s.pack === pack;
      return true;
    });
    if (one) {
      const r1 = E.sku(one.id, ctxBase()), r2 = E.sku(one.id, ctxNew);
      before = r1.campInv; after = r2.campInv;
    }
    dlg.querySelector('#w-preview').innerHTML = n
      ? `<b>${n} SKUs will change.</b>${before != null ? `<br>Example: ${esc(one.desc)} — net per litre ${money(before)} → <b>${money(after)}</b>.` : ''}
         <br><span class="muted small">${esc(sample.join(' · '))}${n > 3 ? ' …' : ''}</span>`
      : '<span class="muted">No SKU currently resolves a different value — check the scope.</span>';
  };
  dlg.querySelector('#w-scope').addEventListener('change', refresh);
  dlg.querySelector('#w-type').addEventListener('change', preview);
  dlg.querySelector('#w-value').addEventListener('input', preview);
  dlg.addEventListener('change', e => { if (e.target.tagName === 'SELECT' && e.target.id !== 'w-scope') preview(); });
  dlg.addEventListener('click', e => {
    const act = e.target.dataset.act;
    if (act === 'closewizard') dlg.remove();
    if (act === 'applywizard') {
      const type = dlg.querySelector('#w-type').value;
      const val = parseFloat(dlg.querySelector('#w-value').value) || 0;
      const sc = dlg.querySelector('#w-scope').value;
      const reason = dlg.querySelector('#w-reason').value.trim();
      if (!reason) { alert('Please give a reason — it is recorded in the change log.'); return; }
      const pick = id => { const el = dlg.querySelector('#' + id); return el ? +el.value : undefined; };
      const rule = { id: ++state.seq, type, scope: sc, value: val, seq: state.seq,
        brand: dlg.querySelector('#w-brand') ? dlg.querySelector('#w-brand').value : undefined,
        grade: pick('w-grade'), pack: pick('w-pack'), sku: pick('w-sku'),
        from: new Date().toISOString().slice(0, 10), reason };
      state.marginRules.push(rule);
      const line = (type === 'UPLABS' ? 'Uplabs' : 'Camp') + ' margin set to Rs ' + val + ' — ' + scopeLabel(rule);
      audit('margin_rule', type === 'UPLABS' ? 'Uplabs margin' : 'Camp margin', 'value', '', 'Rs ' + val, scopeLabel(rule), reason);
      newVersion('In-app — margin change', '1 change', [line]);
      save(); dlg.remove(); route();
    }
  });
  refresh();
}

function route() {
  const hash = location.hash || '#/login';
  const [path, qs] = hash.split('?');
  const params = new URLSearchParams(qs || '');
  const app = document.getElementById('app');
  if (!state.role) { app.innerHTML = viewLogin(); return; }
  if (path === '#/login') { app.innerHTML = viewLogin(); return; }
  const key = { '#/prices': 'prices', '#/u2c': 'u2c', '#/dashboard': 'dashboard', '#/materials': 'materials',
    '#/packs': 'packs', '#/skus': 'skus', '#/margins': 'margins', '#/scenario': 'scenario', '#/audit': 'audit',
    '#/trace': 'trace', '#/formulations': 'formulations', '#/bulk': 'bulk',
    '#/compare': 'compare', '#/upload': 'upload', '#/sync': 'sync' }[path];
  if (key && !allowed(key)) { location.hash = state.role === 'lubigen' ? '#/bulk' : '#/prices'; return; }
  switch (path) {
    case '#/prices': app.innerHTML = viewPrices(); break;
    case '#/u2c': app.innerHTML = viewU2C(); break;
    case '#/dashboard': app.innerHTML = viewDashboard(); break;
    case '#/materials': app.innerHTML = viewMaterials(); break;
    case '#/formulations': app.innerHTML = viewFormulations(); break;
    case '#/packs': app.innerHTML = viewPacks(); break;
    case '#/skus': app.innerHTML = viewSkus(); break;
    case '#/trace': app.innerHTML = viewTrace(params.get('q') || ''); break;
    case '#/margins': app.innerHTML = viewMargins(); break;
    case '#/scenario': app.innerHTML = viewScenario(); break;
    case '#/bulk': app.innerHTML = viewBulk(); break;
    case '#/compare': app.innerHTML = viewCompare(); break;
    case '#/upload': app.innerHTML = viewUpload(); break;
    case '#/sync': app.innerHTML = viewSync(); break;
    case '#/audit': app.innerHTML = viewAudit(); break;
    default: app.innerHTML = viewPrices();
  }
  const qi = document.getElementById('q');
  if (qi) { qi.focus(); qi.setSelectionRange(qi.value.length, qi.value.length); }
}

      state.marginRules = state.marginRules.filter(x => x.id !== id);
      audit('margin_rule', scopeLabel(r), 'value', 'Rs ' + r.value, '(removed)', scopeLabel(r), 'Removed');
      newVersion('In-app — margin removed', '1 change', [(r.type === 'UPLABS' ? 'Uplabs' : 'Camp') + ' margin of Rs ' + r.value + ' removed — ' + scopeLabel(r)]);
      save(); route();
    }
  }
  if (a === 'testthis') { window.__scen = null; location.hash = '#/scenario'; route(); }
});

document.addEventListener('input', e => {
  if (e.target.dataset.act === 'qty') {
    const id = +e.target.dataset.id, v = parseFloat(e.target.value) || 0;
    window.__qty = window.__qty || {};
    if (v > 0) window.__qty[id] = v; else delete window.__qty[id];
    const r = E.sku(id, ctxBase()); const L = P(r.sku.pack).litres;
    const cell = document.querySelector('.amt[data-id="' + id + '"]');
    if (cell) cell.textContent = v > 0 ? money(r.upInv * L * v) : '—';
    u2cTotals();
    return;
  }
});
document.addEventListener('change', e => {
  if (e.target.dataset.act === 'cmpsel') {
    const picks = cmpPicks(); picks[+e.target.dataset.i] = e.target.value ? +e.target.value : null;
    window.__cmp = picks; route(); return;
  }
  if (e.target.id === 'upfile' && e.target.files && e.target.files[0]) { handleUpload(e.target.files[0]); return; }
  if (e.target.id === 'syncfile' && e.target.files && e.target.files[0]) { readChanges(e.target.files[0]); return; }
  if (e.target.dataset.act === 'matfield') {
    const id = +e.target.dataset.id, field = e.target.dataset.field, v = parseFloat(e.target.value);
    const m = M(id);
    if (!isFinite(v)) { route(); return; }
    state.matEdit = state.matEdit || {};
    state.matEdit[id] = state.matEdit[id] || {};
    const was = state.matEdit[id][field] != null ? state.matEdit[id][field] : m[field];
    if (near(v, m[field])) delete state.matEdit[id][field];
    else state.matEdit[id][field] = v;
    if (!near(was, v)) {
      const label = field === 'density' ? 'Density' : 'Inbound transport';
      audit('material', m.name, label, num(was, 4), num(v, 4), 'Raw material ' + label.toLowerCase(), 'Edited on screen');
      newVersion('In-app — material ' + label.toLowerCase(), '1 change',
        [m.name + ' ' + label.toLowerCase() + ' ' + num(was, 4) + ' to ' + num(v, 4)]);
    }
    save(); route(); return;
  }
  if (e.target.dataset.act === 'matprice') {
    const id = +e.target.dataset.id;
    const v = parseFloat(e.target.value);
    const m = M(id);
    if (!isFinite(v)) { route(); return; }
    const was = state.matPrice[id] != null ? state.matPrice[id] : m.price;
    if (near(v, m.price)) delete state.matPrice[id];
    else state.matPrice[id] = v;
    if (!near(was, v)) {
      audit('material', m.name, 'price', 'Rs ' + money(was), 'Rs ' + money(v), 'Raw material price', 'Edited on screen');
      newVersion('In-app — material price', '1 change', [m.name + ' price Rs ' + money(was) + ' to Rs ' + money(v)]);
    }
    save(); route();
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.id === 'q') { location.hash = '#/trace?q=' + encodeURIComponent(e.target.value); route(); }
  if (e.key === 'Enter' && e.target.id === 'u2cq') { window.__u2cq = e.target.value; route(); }
});

window.addEventListener('hashchange', route);
route();
